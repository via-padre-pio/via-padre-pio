<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Via Padre Pio — Lançamento hoje, às 20h</title>
<meta name="description" content="A Via Padre Pio entra no ar hoje, 8 de novembro, às 20h. Uma coleção criada para vestir a fé.">
<meta name="theme-color" content="#5c3a21">

<meta property="og:type" content="website">
<meta property="og:title" content="Via Padre Pio — Lançamento hoje, às 20h">
<meta property="og:description" content="Uma coleção criada para vestir a fé. Lançamento hoje, às 20h.">
<meta property="og:image" content="assets/logo.png">

<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fundo: #f6f1e8;
    --superficie: #fffdf9;
    --tinta: #2b211c;
    --tinta-suave: #6f6158;
    --marca: #5c3a21;
    --marca-escura: #3d2615;
    --destaque: #c08a2e;
    --borda: #e3d8c7;
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100dvh;
    padding: 32px 20px 92px;
    background:
      radial-gradient(900px 420px at 50% -8%,
        color-mix(in srgb, var(--destaque) 18%, transparent), transparent 68%),
      var(--fundo);
    color: var(--tinta);
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .fio {
    position: fixed;
    inset-block-start: 0;
    inset-inline: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--destaque), transparent);
  }

  .pagina {
    width: min(720px, 100%);
    text-align: center;
  }

  /* O palco é maior que o círculo para a nuvem ter onde orbitar, como na capa
     da loja. O logo em si continua do mesmo tamanho de antes. */
  .palco-logo {
    position: relative;
    display: grid;
    place-items: center;
    width: clamp(210px, 58vw, 236px);
    aspect-ratio: 1;
    margin: 0 auto;
    touch-action: manipulation;
  }

  .palco-logo__particulas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .logo {
    position: relative;
    width: 73%;
    height: auto;
    border-radius: 50%;
  }

  @media (prefers-reduced-motion: no-preference) {
    .logo {
      animation: surgir-logo 0.9s ease both, respirar 8s ease-in-out infinite;
    }
  }

  @keyframes surgir-logo {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes respirar {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.028); }
  }

  .assinatura {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1.15rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--marca);
  }

  .traco {
    width: 42px;
    height: 1px;
    margin: 26px auto 22px;
    background: var(--destaque);
  }

  h1 {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.7rem, 4.4vw, 2.35rem);
    letter-spacing: -0.01em;
    line-height: 1.15;
    color: var(--marca-escura);
  }

  .relogio {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(8px, 2vw, 18px);
    margin-top: 28px;
  }

  .unidade { min-width: clamp(76px, 18vw, 120px); }

  .numero {
    display: block;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(3.6rem, 12vw, 6.4rem);
    line-height: 0.85;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    color: var(--marca);
  }

  .rotulo {
    display: block;
    margin-top: 12px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--tinta-suave);
  }

  .separador {
    margin-top: 0.08em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(2.8rem, 8vw, 4.6rem);
    line-height: 0.85;
    color: var(--destaque);
  }

  @media (prefers-reduced-motion: no-preference) {
    .separador { animation: pulso 1s steps(1, end) infinite; }
  }

  @keyframes pulso {
    50% { opacity: 0.2; }
  }

  .recado {
    margin: 28px 0 0;
    font-size: 0.92rem;
    color: var(--tinta-suave);
  }

  /* Reproduutor discreto, fixo no pé da tela. */
  .player {
    position: fixed;
    z-index: 30;
    left: 50%;
    bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
    width: min(420px, calc(100% - 28px));
    height: 48px;
    padding: 6px 8px 6px 6px;
    border-radius: 999px;
    background: #f4f4f5;
    color: #1c1c1e;
    box-shadow: 0 1px 2px rgb(0 0 0 / 8%), 0 10px 28px rgb(43 33 28 / 14%);
  }

  .player__play,
  .player__icone,
  .player__menu button {
    font: inherit;
    color: inherit;
    border: 0;
    cursor: pointer;
  }

  .player__play {
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #e6e6ea;
  }

  .player__play:hover,
  .player__icone:hover { background: #dedee3; }

  .player__tempo {
    flex-shrink: 0;
    font-size: 0.75rem;
    font-weight: 550;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .player__progresso,
  .player__volume {
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    margin: 0;
    border-radius: 999px;
    background: linear-gradient(to right, #2c2c2e var(--preenchido, 0%), #d7d7dc var(--preenchido, 0%));
    cursor: pointer;
  }

  .player__progresso { flex: 1; min-width: 28px; }

  .player__volume {
    width: 84px;
    height: 18px;
    flex-shrink: 0;
    background: transparent;
  }

  .player__progresso::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 0;
    height: 0;
    border: 0;
    background: transparent;
  }

  .player__volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    margin-top: -5px;
    border: 0;
    border-radius: 50%;
    background: #2c2c2e;
  }

  .player__progresso::-webkit-slider-runnable-track {
    height: 4px;
    background: transparent;
  }

  .player__volume::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: linear-gradient(to right, #2c2c2e var(--preenchido, 80%), #d7d7dc var(--preenchido, 80%));
  }

  .player__progresso::-moz-range-thumb { width: 0; height: 0; border: 0; }
  .player__volume::-moz-range-track {
    height: 4px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(to right, #2c2c2e var(--preenchido, 80%), #d7d7dc var(--preenchido, 80%));
  }

  .player__volume::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: 0;
    border-radius: 50%;
    background: #2c2c2e;
  }

  .player__icone {
    display: grid;
    place-items: center;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: transparent;
  }

  .player__menu {
    position: absolute;
    right: 6px;
    bottom: calc(100% + 8px);
    min-width: 148px;
    padding: 6px;
    border-radius: 14px;
    background: #fff;
    box-shadow: 0 8px 28px rgb(43 33 28 / 16%);
  }

  .player__menu button {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 8px 10px;
    border-radius: 10px;
    background: transparent;
    font-size: 0.86rem;
    text-align: left;
  }

  .player__menu button:hover { background: #f4f4f5; }

  .player__menu button[aria-pressed="true"]::after { content: "✓"; }

  .player button:focus-visible,
  .player input:focus-visible {
    outline: 2px solid var(--destaque);
    outline-offset: 2px;
  }

  .so-leitor {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
  <div class="fio" aria-hidden="true"></div>

  <main class="pagina">
    <div class="palco-logo" id="palcoLogo">
      <canvas class="palco-logo__particulas" id="particulasLogo" aria-hidden="true"></canvas>
      <img class="logo" src="assets/logo.png" alt="Via Padre Pio" width="168" height="168">
    </div>
    <p class="assinatura">Fé que se veste.</p>
    <div class="traco" aria-hidden="true"></div>

    <h1 id="titulo">Lançamento hoje, às 20h</h1>

    <div class="relogio" role="timer" aria-labelledby="titulo">
      <div class="unidade">
        <span class="numero" id="horas">––</span>
        <span class="rotulo" id="rotuloHoras">horas</span>
      </div>
      <span class="separador" aria-hidden="true">:</span>
      <div class="unidade">
        <span class="numero" id="minutos">––</span>
        <span class="rotulo" id="rotuloMinutos">minutos</span>
      </div>
      <span class="separador" aria-hidden="true">:</span>
      <div class="unidade">
        <span class="numero" id="segundos">––</span>
        <span class="rotulo" id="rotuloSegundos">segundos</span>
      </div>
    </div>

    <p class="recado" id="recado">Uma coleção criada para vestir a fé.</p>
    <p class="so-leitor" id="leitura" aria-live="polite"></p>

    <noscript>
      <p class="recado">A Via Padre Pio entra no ar hoje, 8 de novembro de 2026, às 20h, horário de Brasília.</p>
    </noscript>
  </main>

  <div class="player" id="player" role="region" aria-label="Trilha sonora, O Elevador">
    <audio id="trilha" src="O_Elevador.mp3" preload="auto" loop></audio>

    <button class="player__play" id="botaoPlay" type="button" aria-label="Tocar">
      <svg id="iconePlay" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M8.2 5.4c0-.9 1-1.5 1.8-.9l9.2 6.1c.7.5.7 1.5 0 1.9l-9.2 6.1c-.8.5-1.8 0-1.8-.9V5.4Z"/>
      </svg>
      <svg id="iconePause" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" hidden>
        <path fill="currentColor" d="M7 5.5h3.2v13H7v-13Zm6.8 0H17v13h-3.2v-13Z"/>
      </svg>
    </button>

    <span class="player__tempo" id="tempoTrilha">0:00 / 0:00</span>

    <input class="player__progresso" id="progressoTrilha" type="range" min="0" max="100" value="0" step="0.1" aria-label="Posição da música">

    <input class="player__volume" id="volumeTrilha" type="range" min="0" max="100" value="80" aria-label="Volume" hidden>

    <button class="player__icone" id="botaoVolume" type="button" aria-label="Volume" aria-expanded="false" aria-controls="volumeTrilha">
      <svg id="iconeSom" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10v4h3.2L12 18V6L7.2 10H4Z" fill="currentColor" stroke="none"/>
        <path d="M15.2 9.2a3.6 3.6 0 0 1 0 5.6"/>
        <path d="M17.6 7a6.4 6.4 0 0 1 0 10"/>
      </svg>
      <svg id="iconeMudo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
        <path d="M4 10v4h3.2L12 18V6L7.2 10H4Z" fill="currentColor" stroke="none"/>
        <path d="m16 10 4 4M20 10l-4 4"/>
      </svg>
    </button>

    <button class="player__icone" id="botaoMenu" type="button" aria-label="Mais opções" aria-expanded="false" aria-controls="menuTrilha">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor">
        <circle cx="12" cy="6" r="1.4"/>
        <circle cx="12" cy="12" r="1.4"/>
        <circle cx="12" cy="18" r="1.4"/>
      </svg>
    </button>

    <div class="player__menu" id="menuTrilha" hidden>
      <button type="button" id="botaoRepetir" aria-pressed="true">Repetir</button>
    </div>
  </div>

<script>
(function () {
  // 20h de hoje no horário de Brasília. O Brasil não usa horário de verão.
  var alvo = new Date("2026-11-08T20:00:00-03:00").getTime();
  var horas = document.getElementById("horas");
  var minutos = document.getElementById("minutos");
  var segundos = document.getElementById("segundos");
  var rotuloHoras = document.getElementById("rotuloHoras");
  var rotuloMinutos = document.getElementById("rotuloMinutos");
  var rotuloSegundos = document.getElementById("rotuloSegundos");
  var titulo = document.getElementById("titulo");
  var recado = document.getElementById("recado");
  var leitura = document.getElementById("leitura");
  var ultimoMinuto = null;
  var encerrou = false;

  function dois(n) {
    return String(n).padStart(2, "0");
  }

  function nome(n, um, varios) {
    return n === 1 ? um : varios;
  }

  function atualizar() {
    var resta = alvo - Date.now();
    if (resta < 0) resta = 0;

    var total = Math.floor(resta / 1000);
    var h = Math.floor(total / 3600);
    var m = Math.floor((total % 3600) / 60);
    var s = total % 60;

    horas.textContent = dois(h);
    minutos.textContent = dois(m);
    segundos.textContent = dois(s);
    rotuloHoras.textContent = nome(h, "hora", "horas");
    rotuloMinutos.textContent = nome(m, "minuto", "minutos");
    rotuloSegundos.textContent = nome(s, "segundo", "segundos");

    if (resta === 0) {
      if (!encerrou) {
        encerrou = true;
        titulo.textContent = "É hora do lançamento";
        recado.textContent = "A Via Padre Pio entra no ar agora.";
        leitura.textContent = "São 20h. A Via Padre Pio entra no ar agora.";
      }
      return true;
    }

    if (m !== ultimoMinuto) {
      ultimoMinuto = m;
      leitura.textContent = "Faltam " + h + " " + nome(h, "hora", "horas")
        + " e " + m + " " + nome(m, "minuto", "minutos")
        + " para o lançamento, hoje às 20h.";
    }
    return false;
  }

  if (atualizar()) return;

  var id = setInterval(function () {
    if (atualizar()) clearInterval(id);
  }, 250);
})();

/* Nuvem dourada em volta do logo, a mesma da capa da loja. O ponteiro
   acelera e inclina a órbita; segurar pressionado recolhe a nuvem. */
(function () {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var palco = document.getElementById("palcoLogo");
  var tela = document.getElementById("particulasLogo");
  if (!palco || !tela) return;

  var pincel = tela.getContext("2d");
  if (!pincel) return;

  var ouro = "#c08a2e";
  var marrom = "#5c3a21";
  var total = 120;

  function umPouco(min, max) {
    return min + Math.random() * (max - min);
  }

  var particulas = [];
  for (var i = 0; i < total; i++) {
    particulas.push({
      angulo: umPouco(0, Math.PI * 2),
      raio: umPouco(0.8, 1.04),
      profundidade: umPouco(-1, 1),
      giro: umPouco(0.1, 0.4),
      tamanho: umPouco(0.55, 2.1),
      opacidade: umPouco(0.28, 1),
      dourada: Math.random() > 0.35
    });
  }

  var velocidade = 1;
  var alvoVelocidade = 1;
  var inclinacao = 0.9;
  var alvoInclinacao = 0.9;
  var abertura = 1;
  var alvoAbertura = 1;
  var brilho = 0;
  var alvoBrilho = 0.85;
  var largura = 0;
  var altura = 0;
  var decorrido = 0;
  var anterior = 0;
  var ativo = true;

  function medir() {
    var area = palco.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    largura = area.width;
    altura = area.height;
    tela.width = Math.round(largura * dpr);
    tela.height = Math.round(altura * dpr);
    pincel.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function aproximar(atual, alvo) {
    return atual + (alvo - atual) * 0.06;
  }

  function desenhar(agora) {
    if (!ativo) return;
    requestAnimationFrame(desenhar);
    if (!largura || !altura) return;

    velocidade = aproximar(velocidade, alvoVelocidade);
    inclinacao = aproximar(inclinacao, alvoInclinacao);
    abertura = aproximar(abertura, alvoAbertura);
    brilho = aproximar(brilho, alvoBrilho);

    var passo = anterior ? Math.min(agora - anterior, 40) : 16;
    anterior = agora;
    decorrido += (passo / 1000) * velocidade;

    pincel.clearRect(0, 0, largura, altura);

    var meioX = largura / 2;
    var meioY = altura / 2;
    var escala = Math.min(largura, altura) / 2;

    for (var n = 0; n < particulas.length; n++) {
      var p = particulas[n];
      var fase = p.angulo + decorrido * p.giro;
      var raio = p.raio * abertura;
      var x = Math.cos(fase) * raio;
      var planoY = Math.sin(fase) * raio;
      var z = p.profundidade * 0.22 * abertura;
      var y = planoY * Math.cos(inclinacao) + z * Math.sin(inclinacao);
      var fundo = -planoY * Math.sin(inclinacao) + z * Math.cos(inclinacao);
      var perto = Math.min(Math.max(0.5 + fundo * 0.7, 0), 1);
      var perspectiva = 1 / (1 - fundo * 0.42);

      pincel.globalAlpha = Math.min(p.opacidade * (0.3 + perto * 0.7) * brilho, 1);
      pincel.fillStyle = p.dourada ? ouro : marrom;
      pincel.beginPath();
      pincel.arc(
        meioX + x * escala * perspectiva,
        meioY + y * escala * perspectiva,
        p.tamanho * (0.55 + perto * 1.3),
        0,
        Math.PI * 2
      );
      pincel.fill();
    }

    pincel.globalAlpha = 1;
  }

  medir();
  window.addEventListener("resize", medir);
  requestAnimationFrame(desenhar);

  document.addEventListener("visibilitychange", function () {
    ativo = !document.hidden;
    anterior = 0;
    if (ativo) requestAnimationFrame(desenhar);
  });

  palco.addEventListener("pointermove", function (evento) {
    var area = palco.getBoundingClientRect();
    alvoVelocidade = 0.35 + ((evento.clientX - area.left) / area.width) * 2.4;
    alvoInclinacao = 0.4 + ((evento.clientY - area.top) / area.height);
    alvoBrilho = 1;
  });

  palco.addEventListener("pointerleave", function () {
    alvoVelocidade = 1;
    alvoInclinacao = 0.9;
    alvoBrilho = 0.85;
  });

  palco.addEventListener("pointerdown", function () {
    alvoAbertura = 0.42;
    alvoBrilho = 1;
  });

  function soltar() {
    alvoAbertura = 1;
    alvoBrilho = 0.85;
  }

  palco.addEventListener("pointerup", soltar);
  palco.addEventListener("pointercancel", soltar);
})();

/* A trilha começa sozinha quando o navegador deixa. Se ele bloquear,
   o primeiro toque fora do reprodutor dá o play — a menos que a pessoa
   já tenha pausado. */
(function () {
  var audio = document.getElementById("trilha");
  var player = document.getElementById("player");
  var botaoPlay = document.getElementById("botaoPlay");
  var iconePlay = document.getElementById("iconePlay");
  var iconePause = document.getElementById("iconePause");
  var tempo = document.getElementById("tempoTrilha");
  var progresso = document.getElementById("progressoTrilha");
  var botaoVolume = document.getElementById("botaoVolume");
  var volume = document.getElementById("volumeTrilha");
  var iconeSom = document.getElementById("iconeSom");
  var iconeMudo = document.getElementById("iconeMudo");
  var botaoMenu = document.getElementById("botaoMenu");
  var menu = document.getElementById("menuTrilha");
  var botaoRepetir = document.getElementById("botaoRepetir");
  var usuarioPausou = false;
  var volumeAntes = 0.8;

  audio.volume = volumeAntes;

  function formato(segundos) {
    if (!isFinite(segundos)) return "0:00";
    var inteiro = Math.floor(segundos);
    return Math.floor(inteiro / 60) + ":" + String(inteiro % 60).padStart(2, "0");
  }

  function desenharTempo() {
    tempo.textContent = formato(audio.currentTime) + " / " + formato(audio.duration);
    if (document.activeElement === progresso) return;
    var pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    progresso.value = String(pct);
    progresso.style.setProperty("--preenchido", pct + "%");
  }

  function desenharPlay() {
    var tocando = !audio.paused;
    iconePlay.hidden = tocando;
    iconePause.hidden = !tocando;
    botaoPlay.setAttribute("aria-label", tocando ? "Pausar" : "Tocar");
  }

  function desenharVolume() {
    var nivel = audio.muted ? 0 : audio.volume;
    volume.value = String(Math.round(nivel * 100));
    volume.style.setProperty("--preenchido", (nivel * 100) + "%");
    iconeSom.hidden = nivel === 0;
    iconeMudo.hidden = nivel !== 0;
    botaoVolume.setAttribute("aria-label", nivel === 0 ? "Ativar som" : "Volume");
  }

  function tocar() {
    var promessa = audio.play();
    if (promessa) promessa.catch(function () {});
  }

  function fecharMenu() {
    menu.hidden = true;
    botaoMenu.setAttribute("aria-expanded", "false");
  }

  botaoPlay.addEventListener("click", function () {
    if (audio.paused) {
      usuarioPausou = false;
      tocar();
    } else {
      usuarioPausou = true;
      audio.pause();
    }
  });

  audio.addEventListener("play", desenharPlay);
  audio.addEventListener("pause", desenharPlay);
  audio.addEventListener("timeupdate", desenharTempo);
  audio.addEventListener("loadedmetadata", desenharTempo);
  audio.addEventListener("durationchange", desenharTempo);

  progresso.addEventListener("input", function () {
    if (!audio.duration) return;
    audio.currentTime = (Number(progresso.value) / 100) * audio.duration;
    progresso.style.setProperty("--preenchido", progresso.value + "%");
  });

  botaoVolume.addEventListener("click", function () {
    var abrir = volume.hidden;
    volume.hidden = !abrir;
    botaoVolume.setAttribute("aria-expanded", abrir ? "true" : "false");
    if (abrir && (audio.muted || audio.volume === 0)) {
      audio.muted = false;
      audio.volume = volumeAntes || 0.8;
      desenharVolume();
    }
  });

  volume.addEventListener("input", function () {
    var nivel = Number(volume.value) / 100;
    audio.muted = false;
    audio.volume = nivel;
    if (nivel > 0) volumeAntes = nivel;
    desenharVolume();
  });

  botaoMenu.addEventListener("click", function () {
    var abrir = menu.hidden;
    menu.hidden = !abrir;
    botaoMenu.setAttribute("aria-expanded", abrir ? "true" : "false");
  });

  botaoRepetir.addEventListener("click", function () {
    audio.loop = !audio.loop;
    botaoRepetir.setAttribute("aria-pressed", audio.loop ? "true" : "false");
  });

  document.addEventListener("pointerdown", function (evento) {
    if (!menu.hidden && !menu.contains(evento.target) && evento.target !== botaoMenu) {
      fecharMenu();
    }
    if (player.contains(evento.target) || usuarioPausou || !audio.paused) return;
    tocar();
  });

  document.addEventListener("keydown", function (evento) {
    if (evento.key === "Escape") fecharMenu();
  });

  desenharPlay();
  desenharTempo();
  desenharVolume();
  tocar();
})();
</script>
</body>
</html>
